name: Windows Native Build

# Full compile + test of the native Windows (WinUI 3 / .NET 10) implementation.
# The solution only defines x64/x86/ARM64 platforms (no AnyCPU) and the test
# project references the WinUI app, so the whole solution is built for x64 on a
# Windows runner (the WinUI target cannot build on Linux).
#
# WinUI 3 PRI resource generation (MrtCore.PriGen -> ExpandPriContent task) uses a
# .NET Framework MSBuild task that does NOT load under the `dotnet build` (.NET Core)
# MSBuild engine, so the build is driven by the full Visual Studio msbuild.exe.
# The .NET SDK is pinned to 10.0.3xx+ via windows-native/src/global.json for the
# C# compilation.

on:
  push:
    branches:
      - claude/multi-agent-code-review-bVmNX
      - claude/design-document-ingestion-27bl5z
      - claude/multi-agent-document-exec-597ynm
      - claude/remove-electron-macos-prep-j9gl75
    paths:
      - 'windows-native/**'
      - 'shared-contracts/dotnet/**'
      - '.github/workflows/windows-native-build.yml'
  # Any pull request touching the Windows sources gets built, regardless of
  # branch name. The push list above is a per-branch opt-in that a new branch
  # silently misses, which meant a PR could change the WinUI solution and merge
  # with no Windows build having run at all.
  pull_request:
    paths:
      - 'windows-native/**'
      - 'shared-contracts/dotnet/**'
      - '.github/workflows/windows-native-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: windows-native/src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild (Visual Studio)
        uses: microsoft/setup-msbuild@v2

      - name: dotnet --info
        run: dotnet --info

      - name: Build (Release | x64) via VS MSBuild
        shell: pwsh
        run: |
          msbuild MemoryTimeline.sln /t:Restore,Build `
            /p:Configuration=Release /p:Platform=x64 /m /v:minimal `
            /clp:NoSummary 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          # Surface distinct MSBuild/compiler error lines as GH annotations (readable
          # without auth-gated logs), plus a job-summary list. Cap at 30.
          $errs = Select-String -Path build.log -Pattern ': error ' |
                  ForEach-Object { $_.Line.Trim() } | Sort-Object -Unique
          $errs | Select-Object -First 30 | ForEach-Object { "::error::$_" }
          "### Build errors ($($errs.Count))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          $errs | ForEach-Object { "- $_" } | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: windows-native/src/build.log
          if-no-files-found: ignore

      # Tests are gating: a vstest failure (or a missing test assembly) fails the
      # run. Note the sln maps the Tests project's Release|x64 to Release|AnyCPU,
      # so its output lands in bin/Release/<tfm>/ (no x64 path segment); search
      # both layouts recursively so a future platform-mapping change still works.
      - name: Test (Release | x64)
        if: success()
        shell: pwsh
        run: |
          # Discover the built test assembly. Recurse from the Tests project root
          # (covers both bin/x64/Release and bin/Release), exact dll name only,
          # excluding intermediate obj/ output and reference-assembly ref/ folders.
          $candidates = Get-ChildItem -Path MemoryTimeline.Tests -Recurse -File `
                          -Filter MemoryTimeline.Tests.dll -ErrorAction SilentlyContinue |
                        Where-Object { $_.FullName -notmatch '[\\/](obj|ref)[\\/]' -and
                                       $_.FullName -match '[\\/]bin[\\/]' }
          # Prefer bin/x64/Release over bin/Release; tie-break on newest build.
          $dll = $candidates |
                 Sort-Object @{ Expression = {
                     if ($_.FullName -match '[\\/]bin[\\/]x64[\\/]Release[\\/]') { 0 }
                     elseif ($_.FullName -match '[\\/]bin[\\/]Release[\\/]') { 1 }
                     else { 2 } } },
                   @{ Expression = 'LastWriteTime'; Descending = $true } |
                 Select-Object -First 1
          if (-not $dll) {
            "::error::MemoryTimeline.Tests.dll not found under MemoryTimeline.Tests (searched bin/x64/Release and bin/Release recursively, excluding obj/ and ref/). Failing the run."
            if (Test-Path MemoryTimeline.Tests/bin) {
              Write-Host "Files present under MemoryTimeline.Tests/bin:"
              Get-ChildItem -Path MemoryTimeline.Tests/bin -Recurse -File |
                Select-Object -First 200 |
                ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "MemoryTimeline.Tests/bin does not exist. Project directory contents:"
              Get-ChildItem -Path MemoryTimeline.Tests |
                ForEach-Object { Write-Host "  $($_.FullName)" }
            }
            exit 1
          }
          Write-Host "Running tests in $($dll.FullName)"
          dotnet vstest $dll.FullName --logger:"trx;LogFileName=test.trx" `
            --ResultsDirectory:TestResults 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          # Concise, high-signal diagnostics (annotation channel is small): parse the
          # TRX counters if present, else show the first few log lines (load errors
          # surface early). Logs/TRX are also uploaded as an artifact.
          $trx = Get-ChildItem -Recurse -Path TestResults -Filter *.trx | Select-Object -First 1
          if ($trx) {
            [xml]$x = Get-Content $trx.FullName
            $c = $x.TestRun.ResultSummary.Counters
            "::error::TESTS total=$($c.total) passed=$($c.passed) failed=$($c.failed) exit=$code"
            $x.TestRun.Results.UnitTestResult |
              Where-Object { $_.outcome -eq 'Failed' } | Select-Object -First 6 |
              ForEach-Object { "::error::FAILED $($_.testName): $($_.Output.ErrorInfo.Message)" }
          } else {
            "::error::No TRX produced (vstest exit=$code). First log lines:"
            Get-Content test.log -TotalCount 8 | ForEach-Object { "::error::$($_.Trim())" }
          }
          "### Test output (exit $code)" | Out-File $env:GITHUB_STEP_SUMMARY -Append
          Get-Content test.log -Tail 100 | ForEach-Object { "- $_" } | Out-File $env:GITHUB_STEP_SUMMARY -Append
          exit $code

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            windows-native/src/test.log
            windows-native/src/TestResults
          if-no-files-found: ignore
