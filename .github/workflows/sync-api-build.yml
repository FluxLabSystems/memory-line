name: Sync API Build

# Compile + test of the Memory Line Sync API (ASP.NET Core, net10.0) and the
# shared sync contracts library. Unlike the WinUI solution, these are plain
# cross-platform .NET projects, so they build and run their full test suite on
# a Linux runner with the dotnet CLI.
#
# The test suite includes the contract-compatibility gate
# (ContractCompatibilityTests), which reads shared-contracts/openapi/*.yaml and
# shared-contracts/README.md, so the whole shared-contracts tree is in the path
# filter — not only the dotnet/ half.

on:
  push:
    branches:
      - main
    paths:
      - 'services/**'
      - 'shared-contracts/**'
      - '.github/workflows/sync-api-build.yml'
  # Any pull request touching the service or the contracts gets built,
  # regardless of branch name; the push trigger above only covered a branch
  # that had long since merged, so nothing ran on PRs at all.
  pull_request:
    paths:
      - 'services/**'
      - 'shared-contracts/**'
      - '.github/workflows/sync-api-build.yml'
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build services/MemoryTimeline.Services.sln -c Release

      - name: Test (Release)
        run: >
          dotnet test services/MemoryTimeline.SyncApi.Tests/MemoryTimeline.SyncApi.Tests.csproj
          -c Release --no-build
          --logger "trx;LogFileName=test.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-api-test-results
          path: TestResults
          if-no-files-found: ignore
