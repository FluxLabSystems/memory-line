name: Documentation Site

# Builds the static documentation website from the repository's markdown and
# publishes it to GitHub Pages.
#
# The deploy job requires Settings -> Pages -> Source: "GitHub Actions" on the
# repository. Until that is enabled the build job still runs and verifies that
# the site generates cleanly; only the deploy step will fail.

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '**/*.md'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'website/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight Pages deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install docs dependencies
        working-directory: website
        run: npm ci || npm install

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Check for broken internal links
        working-directory: website
        run: node check-links.mjs

      # The rendered site is committed (website/_site) so the repository's
      # Pages deployment is reviewable as a diff. That only works if whoever
      # changes markdown also rebuilds and commits the output, so a stale
      # _site fails the run. The page footer carries the build date; changes
      # to that line alone are ignored (-I), everything else counts — as do
      # files the build added or removed, which git status reports.
      - name: Fail if the committed website/_site is stale
        run: |
          set -euo pipefail
          git diff -I 'generated [0-9]{4}-[0-9]{2}-[0-9]{2}' --stat --exit-code -- website/_site > /tmp/site-diff.txt || {
            echo "::error::website/_site is stale. Run 'npm --prefix website run build' and commit the result."
            cat /tmp/site-diff.txt
            exit 1
          }
          untracked="$(git status --porcelain --untracked-files=all -- website/_site)"
          if [ -n "$untracked" ]; then
            echo "::error::website/_site has files the committed tree does not (or vice versa). Rebuild and commit."
            echo "$untracked"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
