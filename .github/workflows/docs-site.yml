name: Documentation Site

# Builds the static documentation website from the repository's markdown and
# publishes it to GitHub Pages.
#
# Publishing is opt-in, gated on the repository variable DEPLOY_PAGES. Until
# the owner enables it, every merge to main used to fail in the deploy job with
# "Ensure GitHub Pages has been enabled" (a 404 from the Pages API), while the
# build job had already proved the site generates cleanly. To turn publishing
# on:
#   1. Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
#   2. Settings -> Secrets and variables -> Actions -> Variables -> New
#      repository variable: name DEPLOY_PAGES, value true.
# Both the artifact upload and the deploy job read that variable; with it unset
# (or anything but "true") they are skipped and the run stays green.

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - '**/*.md'
      - '.github/workflows/docs-site.yml'
  pull_request:
    paths:
      - 'website/**'
      - '**/*.md'
      - '.github/workflows/docs-site.yml'
  workflow_dispatch:

permissions:
  contents: read

# Let an in-flight Pages deployment finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install docs dependencies
        working-directory: website
        run: npm ci || npm install

      - name: Build site
        working-directory: website
        run: npm run build

      - name: Check for broken internal links
        working-directory: website
        run: node check-links.mjs

      # The rendered site is committed (website/_site) so the repository's
      # Pages deployment is reviewable as a diff. That only works if whoever
      # changes markdown also rebuilds and commits the output, so a stale
      # _site fails the run. The page footer carries a "generated" date that
      # build.mjs derives from the newest git commit touching the site's
      # sources, so a rebuild of unchanged sources is byte-identical — but a
      # contributor builds before their commit exists, and this job builds
      # after it does, so that one line can still legitimately differ. It is
      # ignored (-I); everything else counts — as do files the build added or
      # removed, which git status reports.
      - name: Fail if the committed website/_site is stale
        run: |
          set -euo pipefail
          git diff -I 'generated [0-9]{4}-[0-9]{2}-[0-9]{2}' --stat --exit-code -- website/_site > /tmp/site-diff.txt || {
            echo "::error::website/_site is stale. Run 'npm --prefix website run build' and commit the result."
            cat /tmp/site-diff.txt
            exit 1
          }
          untracked="$(git status --porcelain --untracked-files=all -- website/_site)"
          if [ -n "$untracked" ]; then
            echo "::error::website/_site has files the committed tree does not (or vice versa). Rebuild and commit."
            echo "$untracked"
            exit 1
          fi

      # Only when publishing is enabled (see the header): an artifact nobody
      # deploys is wasted minutes.
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/_site

  # Skipped — not failed — until the DEPLOY_PAGES repository variable is set
  # to "true" and Pages is sourced from GitHub Actions (see the header).
  deploy:
    if: github.event_name != 'pull_request' && vars.DEPLOY_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
