openapi: 3.0.3

# Memory Line Sync API v1 — wire contract.
# Faithful to docs/design/IOS-ROADTRIP-COMPANION-SYSTEM-DESIGN.md §11 (API design),
# §6 (domain model), and §12 (synchronization). Every schema mirrors a shipped DTO
# in ../dotnet/MemoryTimeline.SyncContracts (used verbatim by
# services/MemoryTimeline.SyncApi and the Windows sync client, serialized camelCase
# via System.Text.Json web defaults); see ../README.md for versioning rules.
#
# This file is checked by a test in services/MemoryTimeline.SyncApi.Tests
# (ContractCompatibilityTests): every path+method here must be routed by the
# service and vice versa, every DTO must have a schema with the same property
# names, and the entityType enums must match SyncChangeEntityType. Edit the DTOs
# and this file together, in the same commit, or the sync-api workflow fails.

info:
  title: Memory Line Sync API
  version: 1.4.0
  description: >-
    Device-neutral sync, capture, assistant, and roadtrip API for Memory Line.
    Conventions (design doc section 11.1): base path /api/v1, JSON metadata,
    multipart upload for large artifacts, UUID identifiers, UTC ISO 8601
    timestamps, camelCase JSON field names, an optional Idempotency-Key header
    on create/mutation calls, and cursor-based synchronization. When the header
    is present, the server stores the successful response for each
    (deviceId, idempotencyKey) pair for a retention window and replays the
    stored result for a repeated key — except that credential material is never
    stored: a replayed device registration returns the same device identity
    with freshly minted tokens. Sync push idempotency does not rely on the
    header — it is carried by per-entry clientSequence receipts.

servers:
  - url: /api/v1
    description: All paths in this document are relative to the /api/v1 base path.

security:
  - bearerAuth: []

tags:
  - name: devices
    description: Device registration, token refresh, listing, and revocation.
  - name: captures
    description: Device-neutral capture lifecycle (design doc section 6.1).
  - name: artifacts
    description: Multipart artifact upload/download with integrity validation (section 11.4).
  - name: sync
    description: Cursor-based push/pull/ack synchronization (section 12).
  - name: assistant
    description: Voice assistant sessions and turns (section 6.6).
  - name: trips
    description: Trip lifecycle, route context snapshots, and detour generation.
  - name: detours
    description: Detour suggestion disposition (section 6.5).

paths:

  # ---------------------------------------------------------------- devices

  /devices/register:
    post:
      tags: [devices]
      operationId: registerDevice
      summary: Register a device and obtain device-bound tokens.
      description: >-
        Unauthenticated; gated by the owner pairing code in the request body
        (invalid pairing code returns 401 invalid_pairing_code). Sending an
        Idempotency-Key lets a paired caller replay its earlier registration
        result after a lost response.
      security: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRegisterRequest'
      responses:
        '201':
          description: Device registered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceRegisterResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /devices/{deviceId}/refresh:
    post:
      tags: [devices]
      operationId: refreshDeviceToken
      summary: Exchange a refresh token for a new token pair (rotating refresh).
      description: >-
        Unauthenticated; the refresh token in the body is the credential. An
        unknown device ID, a revoked device, and a stale or expired refresh
        token all produce the same 401 error shape (codes
        refresh_token_invalid or device_revoked) — never 404 — so device IDs
        cannot be enumerated.
      security: []
      parameters:
        - $ref: '#/components/parameters/DeviceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
      responses:
        '200':
          description: >-
            New token pair issued. The previous refresh token remains accepted
            only within the server's configured recovery grace window
            (RefreshTokenGraceSeconds, default 300; 0 = strict immediate
            rotation), then is invalidated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      summary: List the owner's registered devices, including revoked ones.
      responses:
        '200':
          description: Devices in registration order.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceInfo'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      summary: Revoke a device. Its tokens stop working immediately.
      parameters:
        - $ref: '#/components/parameters/DeviceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '204':
          description: Device revoked.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # --------------------------------------------------------------- captures

  /captures:
    post:
      tags: [captures]
      operationId: createCapture
      summary: Create a capture from device-generated metadata.
      description: >-
        The client generates the captureId. Replaying an existing captureId
        (or repeating an Idempotency-Key) is idempotent: the existing capture
        is returned with 200 rather than creating a duplicate.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureCreateRequest'
      responses:
        '200':
          description: Idempotent replay — a capture with this ID already exists and is returned as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '201':
          description: Capture created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /captures/{captureId}:
    get:
      tags: [captures]
      operationId: getCapture
      summary: Fetch a capture.
      parameters:
        - $ref: '#/components/parameters/CaptureId'
      responses:
        '200':
          description: The capture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [captures]
      operationId: updateCapture
      summary: Update non-critical descriptive capture metadata (last writer wins).
      description: >-
        The body is a JSON object where an absent key means "unchanged" and an
        explicit null clears a nullable field. Last writer wins — no revision
        conflict is raised.
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CaptureUpdateRequest'
      responses:
        '200':
          description: Updated capture.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /captures/{captureId}/complete:
    post:
      tags: [captures]
      operationId: completeCapture
      summary: Mark a capture fully uploaded; all declared artifacts must be complete.
      description: >-
        Every artifact declared on the capture must be complete (an artifact
        already purged by retention counts as done); otherwise the call is
        rejected with 409 capture_artifacts_incomplete, which is retryable —
        finish the upload and call again. Nothing is declared at all: the same
        409, since a capture with no content has nothing for Windows to
        process.


        A capture still in a client-authored pre-upload status (local_only or
        uploading) advances to received with a bumped serverRevision and
        publishes a capture change carrying the completed audio artifact. A
        capture already at or past received is left exactly as it is — artifact
        completion already appended the ingestion-triggering change — so
        replaying this call appends nothing and returns the current state.
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Capture accepted for processing (or already was).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /captures/{captureId}/retry:
    post:
      tags: [captures]
      operationId: retryCapture
      summary: Re-run processing for a failed capture.
      description: >-
        Re-queues a capture whose status is failed: the status returns to
        received, serverRevision is bumped, and a capture change carrying the
        complete audio artifact is published so Windows can download and
        ingest it again. Only a failed capture may be retried — any other
        status is rejected with 409 capture_not_failed — and not one whose
        audio the retention sweep has purged (409 artifact_purged; upload the
        audio again first).


        The capture_status projection is Windows-authored and is deliberately
        left untouched: it keeps reporting the failure until Windows publishes
        the outcome of the retried run. Whether Windows re-processes a capture
        it has already ingested once is the Windows client's decision, tracked
        on that side.
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Capture re-queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capture'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # --------------------------------------------------------------- artifacts

  /captures/{captureId}/artifacts/initiate:
    post:
      tags: [artifacts]
      operationId: initiateArtifactUpload
      summary: Declare an artifact and begin a multipart upload.
      description: >-
        Declares the artifact's integrity data before any bytes move.
        Re-initiating an existing artifact with the identical declaration
        replays the upload parameters with 200; re-initiating with a different
        declaration, or an artifact ID already used by another capture, is
        rejected with 409 artifact_conflict.
      parameters:
        - $ref: '#/components/parameters/CaptureId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactInitiateRequest'
      responses:
        '200':
          description: Idempotent replay of an earlier initiate with the same declaration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactInitiateResponse'
        '201':
          description: Upload session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactInitiateResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /artifacts/{artifactId}/parts/{partNumber}:
    put:
      tags: [artifacts]
      operationId: uploadArtifactPart
      summary: Upload one part of an artifact. Re-uploading a part number replaces it.
      description: >-
        Raw bytes, inherently retry-safe (a re-PUT overwrites the part), so no
        Idempotency-Key is used. Parts can only be uploaded while the artifact
        is pending or uploading (otherwise 409 artifact_invalid_state); a part
        larger than partSizeBytes is rejected with 413
        artifact_part_too_large, and 404 artifact_not_found covers invalid or
        unknown artifact IDs.
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/PartNumber'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        '204':
          description: Part stored.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /artifacts/{artifactId}/complete:
    post:
      tags: [artifacts]
      operationId: completeArtifactUpload
      summary: Finish a multipart upload after all parts are stored.
      description: >-
        The server validates the completion claim against the initiate
        declaration and then against the assembled bytes (design doc section
        11.4). Mismatches return 422 (codes artifact_part_count_mismatch,
        artifact_length_mismatch, artifact_hash_mismatch); a missing part
        returns 409 artifact_incomplete_parts (retryable — upload the part,
        then complete again). Re-completing an already-complete artifact with
        the same sha256 replays 200.
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactCompleteRequest'
      responses:
        '200':
          description: Artifact validated and stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCompleteResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /artifacts/{artifactId}/download:
    get:
      tags: [artifacts]
      operationId: downloadArtifact
      summary: Download artifact content.
      description: >-
        Available once the artifact is complete; until then the request is
        rejected with 409 artifact_not_complete. Range requests are supported.
        The response media type is the artifact's declared mediaType
        (application/octet-stream when none was declared).


        Once the service's retention sweep has purged the bytes (14 days after
        Windows acknowledged archival with a completed capture_status, or
        sooner under storage pressure — design doc section 22, decision 7) the
        artifact's state is purged and the request is rejected with 410
        artifact_purged. That is permanent, never retryable: the metadata row
        survives, the content does not.
      parameters:
        - $ref: '#/components/parameters/ArtifactId'
      responses:
        '200':
          description: Artifact bytes.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # -------------------------------------------------------------------- sync

  /sync/push:
    post:
      tags: [sync]
      operationId: pushSyncChanges
      summary: Push locally recorded changes (client outbox drain).
      description: >-
        The batch is not transactional: each entry is applied independently
        and reported in results (one bad entry never fails the batch). Entry
        idempotency is carried by clientSequence — a replayed sequence from
        the same device is acknowledged with duplicate=true instead of being
        re-applied.


        Entry-level validation failures are reported per entry (accepted=false
        with an error code in the result), not as an HTTP status: a batch of
        entries that all fail still answers 200. The 4xx responses below cover
        the request as a whole — a malformed body or a missing/expired token.


        capture_status entries (Windows-authored processing status, design doc
        section 19 Phase 3) are validated before they enter the change log, and
        rejected rather than silently repaired. The entry is refused with
        validation_error when its operation is delete, when payloadJson is
        absent or unparseable, when the payload captureId is not a UUID equal to
        entityId, when status falls outside the vocabulary, when
        transcriptPreview exceeds 600 characters — the publisher owns
        truncation, so an over-long preview is refused, not cut down — or when
        any of the three counts is negative. It is refused with
        capture_not_found when no capture with that ID belongs to the caller's
        owner. Only the code before the colon is contractual; the text after it
        is advisory detail.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Per-change acceptance results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /sync/pull:
    get:
      tags: [sync]
      operationId: pullSyncChanges
      summary: Pull changes after a cursor, in change order.
      description: >-
        Returns changes with changeId greater than the cursor, oldest first,
        excluding changes that originated on the calling device.


        The log is owner-scoped, so it fans out to every other device of the
        owner. Echo suppression keys on the device that *published* the change,
        never on the device a capture came from — which is what lets a phone
        pull the capture_status changes Windows publishes about the phone's own
        captures.
      parameters:
        - $ref: '#/components/parameters/SyncCursor'
        - $ref: '#/components/parameters/SyncLimit'
      responses:
        '200':
          description: Ordered changes plus the cursor to resume from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /sync/ack:
    post:
      tags: [sync]
      operationId: ackSyncCursor
      summary: Acknowledge that all changes up to a cursor were applied locally.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncAckRequest'
      responses:
        '204':
          description: Cursor acknowledged.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # --------------------------------------------------------------- assistant

  # Windows is the brain by default (design doc section 19 Phase 4). The archive,
  # the retrieval index, and the extraction prompts all live in Windows, and
  # Phase 3 already made Windows the only writer, so these endpoints STORE AND
  # ROUTE turns — they never retrieve or generate. A turn asked from a phone is
  # dispatched over the existing sync change feed to Windows, which answers and
  # pushes the result back exactly as capture status already flows. This section
  # mirrors ../dotnet/MemoryTimeline.SyncContracts/AssistantContracts.cs.

  /assistant/sessions:
    post:
      tags: [assistant]
      operationId: createAssistantSession
      summary: Open an assistant session.
      description: >-
        A session scopes turn ordering and shared context, and only the device
        that opened it may add turns. Its preferredResponder is a default, not a
        binding: every turn may override it, so a client whose PC goes to sleep
        mid-conversation falls back on the next turn instead of starting over.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantSessionCreateRequest'
      responses:
        '201':
          description: Session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSessionResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /assistant/sessions/{sessionId}:
    get:
      tags: [assistant]
      operationId: getAssistantSession
      summary: Fetch a session.
      description: >-
        Returns turnCount and lastTurnAtUtc as well as the session's identity,
        so a client resuming a conversation — or an idle-session reaper — can
        tell how far it got without replaying every turn.


        A session belonging to another device, even another device of the same
        owner, answers 404 assistant_session_not_found rather than a distinct
        forbidden — the same anti-enumeration stance as device refresh, since a
        403 would confirm the identifier is real.
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantSessionResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /assistant/sessions/{sessionId}/turns:
    post:
      tags: [assistant]
      operationId: createAssistantTurn
      summary: Ask a question. Accepted immediately, answered asynchronously.
      description: >-
        The service does not answer — it makes the turn durable and routes it.
        For the default windows responder that means publishing an
        assistant_turn change toward Windows, which answers and pushes the
        answered turn back over the same feed. The response therefore carries
        status pending and no result; the asking device learns the outcome from
        its ordinary sync pull, or by polling GET /assistant/turns/{turnId}.


        Submission is idempotent on the client-generated turnId, so a retry
        after a lost response never asks the same question twice. A known
        turnId is never re-dispatched: the turn as it stands is returned with
        200, and by then it may be pending, dispatched, answering, completed,
        failed, or cancelled. The first submission wins outright — the stored
        turn is returned even if the replayed body now says something different,
        because a lost response is far likelier than a client deliberately
        reusing an ID. Reuse across conversations is the one case that is
        refused: a turnId already belonging to another session, or to another
        device, answers 409 assistant_turn_conflict rather than replaying the
        earlier question. An unknown or foreign sessionId answers 404
        assistant_session_not_found.


        The request carries text, never audio. Speech-to-text happens on the
        device, so no audio and no full transcript ever crosses this API
        (design doc section 14.5); a turn's question is the user's words, and
        the archive itself stays where it lives. Question length and
        device-supplied clientContext are both bounded by the service, and an
        oversized value is refused whole with 400 validation_error rather than
        truncated — a client is never silently answered on a fraction of what
        it sent, and only the device knows which of its retrieval hits it can
        afford to drop.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssistantTurnCreateRequest'
      responses:
        '200':
          description: >-
            Idempotent replay — a turn with this ID already exists and its
            current state is returned as-is, without asking again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnResponse'
        '201':
          description: >-
            Turn accepted and durable, status pending, addressable immediately
            at /assistant/turns/{turnId}. Acceptance means the turn will be
            routed, not that it will be answered: with the windows responder it
            waits in the change feed until Windows next pulls.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /assistant/turns/{turnId}:
    get:
      tags: [assistant]
      operationId: getAssistantTurn
      summary: Poll one turn's current state.
      description: >-
        The authoritative state of a turn, including its result once a responder
        has answered. A device running the sync pull loop already learns the same
        thing from assistant_turn changes and need not poll; this endpoint exists
        for surfaces that hold no local cursor (a fresh launch, a watch, a
        diagnostic tool) and for recovering when a client dropped a change.


        A turn belonging to another device answers 404
        assistant_turn_not_found, not a distinct forbidden, for the same
        anti-enumeration reason as elsewhere.
      parameters:
        - $ref: '#/components/parameters/TurnId'
      responses:
        '200':
          description: The turn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /assistant/turns/{turnId}/cancel:
    post:
      tags: [assistant]
      operationId: cancelAssistantTurn
      summary: Interrupt a turn.
      description: >-
        Interruption and cancellation are explicit Phase 4 requirements (design
        doc section 19): an answer the user has stopped caring about must be
        stoppable mid-sentence, hands-free, while driving.


        Cancellation is best-effort and idempotent. A non-terminal turn moves to
        cancelled and the new state is published on the change feed, so a
        responder already mid-answer learns to stop. A turn already in a
        terminal state (completed, failed, or cancelled) is returned unchanged
        with 200 and publishes nothing: an interruption inherently races the
        answer, and neither erasing an answer the user may already have heard
        nor turning that race into an error would help them. Unknown or foreign
        turn IDs answer 404 assistant_turn_not_found.
      parameters:
        - $ref: '#/components/parameters/TurnId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: >-
            The turn's state after the cancellation attempt — cancelled, or the
            terminal state it had already reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantTurnResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ------------------------------------------------------------------- trips

  /trips:
    post:
      tags: [trips]
      operationId: createTrip
      summary: Create a trip.
      description: >-
        The service mints the tripId. Trips are owner-scoped, like captures:
        every device of the owner reads and updates the same trips. A status
        of active at creation stamps startedAtUtc when none is sent.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripCreateRequest'
      responses:
        '201':
          description: Trip created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    get:
      tags: [trips]
      operationId: listTrips
      summary: List the owner's trips, newest first (added in v1.4).
      responses:
        '200':
          description: The owner's trips.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Trip'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /trips/{tripId}:
    get:
      tags: [trips]
      operationId: getTrip
      summary: Fetch a trip (added in v1.4).
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: The trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }
    patch:
      tags: [trips]
      operationId: updateTrip
      summary: Update trip metadata or status (latest valid state transition wins).
      description: >-
        The body is a JSON object where an absent key means "unchanged" and an
        explicit null clears a nullable field, as for captures. A status key
        runs through the trip state machine (design doc section 12.2):
        planned → active | archived; active → paused | completed | archived;
        paused → active | completed | archived; completed → archived; archived
        is terminal. Asking for the status the trip already has is a no-op;
        any other move the machine lacks is rejected with 409
        trip_invalid_transition. Moving to active stamps startedAtUtc when the
        trip has none, and completing stamps endedAtUtc the same way.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TripUpdateRequest'
      responses:
        '200':
          description: Updated trip.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trip'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /trips/{tripId}/route-context:
    post:
      tags: [trips]
      operationId: appendRouteContext
      summary: Record a route context snapshot for a trip.
      description: >-
        One contextual snapshot per capture by default; continuous trails only
        when the user explicitly enables trip logging (design doc section 6.4).
        A client-supplied routeContextId that parses as a UUID is honoured and
        replaying it returns the stored snapshot with 200; otherwise the
        service mints one. The service keeps a trip's trail for 14 days
        (section 22, decision 9) and always its newest snapshot; exact
        location is never logged (section 14.5).
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteContext'
      responses:
        '200':
          description: Idempotent replay — a snapshot with this routeContextId already exists and is returned as-is.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteContext'
        '201':
          description: Snapshot stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteContext'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /trips/{tripId}/detours/generate:
    post:
      tags: [trips]
      operationId: generateDetourSuggestions
      summary: Generate verified detour suggestions for the trip's current route context.
      description: >-
        Runs the configured place provider against the trip's most recent
        route context snapshot and returns the suggestions it produced, newest
        first, each stored in the proposed state with an expiry. Places
        already suggested, saved, accepted or dismissed on this trip are never
        proposed again (design doc section 10.5). An empty array is a real
        answer, not an error: the trip has no route context yet, or the service
        has no place provider configured — the shipped service has none (the
        Google/Apple adapters of section 22, decision 5, are not built), so it
        invents nothing.
      parameters:
        - $ref: '#/components/parameters/TripId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Newly generated suggestions.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetourSuggestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /trips/{tripId}/detours:
    get:
      tags: [trips]
      operationId: listDetourSuggestions
      summary: List detour suggestions for a trip.
      parameters:
        - $ref: '#/components/parameters/TripId'
      responses:
        '200':
          description: Suggestions, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DetourSuggestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  # ----------------------------------------------------------------- detours

  /detours/{suggestionId}/accept:
    post:
      tags: [detours]
      operationId: acceptDetourSuggestion
      summary: Accept a suggestion (monotonic; not overwritten by a stale proposed state).
      description: >-
        Disposition is a monotonic state machine (design doc section 12.2):
        proposed, heard and saved may each become accepted or dismissed, both
        terminal; a suggestion whose expiresAtUtc has passed becomes expired,
        also terminal, the moment it is read. Asking for the state a
        suggestion already has is a no-op 200; a move the machine lacks is
        409 detour_invalid_transition. The same rules apply to dismiss and
        save (save is a step before accept or dismiss, from proposed or heard
        only).
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Suggestion in accepted state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetourSuggestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /detours/{suggestionId}/dismiss:
    post:
      tags: [detours]
      operationId: dismissDetourSuggestion
      summary: Dismiss a suggestion.
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Suggestion in dismissed state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetourSuggestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

  /detours/{suggestionId}/save:
    post:
      tags: [detours]
      operationId: saveDetourSuggestion
      summary: Save a suggestion for later.
      parameters:
        - $ref: '#/components/parameters/SuggestionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Suggestion in saved state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetourSuggestion'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalServerError' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Short-lived device-bound access token obtained from device registration
        or refresh (design doc section 14.1).

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        Optional replay key, unique per logical operation. When present on an
        authenticated mutation, the server stores the successful (2xx)
        response for the (deviceId, key) pair for a retention window and
        replays the stored status and body for a repeated key without
        re-executing the handler; failed responses are not stored, so a
        corrected retry re-executes (design doc section 11.4). The service
        treats this purely as an opt-in replay mechanism — mutations are also
        idempotent without it via client-generated IDs, re-PUT part uploads,
        and clientSequence receipts on sync push.
      schema:
        type: string
        maxLength: 128
    DeviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaptureId:
      name: captureId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ArtifactId:
      name: artifactId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PartNumber:
      name: partNumber
      in: path
      required: true
      description: 1-based part index within the multipart upload.
      schema:
        type: integer
        minimum: 1
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TurnId:
      name: turnId
      in: path
      required: true
      description: >-
        Client-generated turn ID, which is why a turn is addressable before the
        service has ever seen it.
      schema:
        type: string
        format: uuid
    TripId:
      name: tripId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SuggestionId:
      name: suggestionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SyncCursor:
      name: cursor
      in: query
      required: false
      description: >-
        Change ID after which to resume (the nextCursor from the previous
        pull). Omit, or pass 0, to start from the beginning.
      schema:
        type: integer
        format: int64
        default: 0
    SyncLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of changes to return.
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100

  responses:
    BadRequest:
      description: The request is malformed or fails validation. Not retryable as-is.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing, expired, or revoked token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: >-
        The addressed entity does not exist or is not owned by the caller
        (capture_not_found, artifact_not_found, device_unknown,
        assistant_session_not_found, assistant_turn_not_found, trip_not_found,
        detour_not_found).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: >-
        Conflicting state: duplicate ID with a different declaration, invalid
        lifecycle state, or missing parts (artifact_incomplete_parts is
        retryable after uploading the missing part). On captures:
        capture_artifacts_incomplete (complete called before every declared
        artifact finished — retryable) and capture_not_failed (retry called on
        a capture that is not failed). On trips and detours:
        trip_invalid_transition and detour_invalid_transition (a state-machine
        move the entity does not allow from where it is).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: >-
        The addressed content existed but was removed on purpose and will not
        come back (artifact_purged: the retention sweep deleted the bytes after
        Windows acknowledged archival). Never retryable.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The request body exceeds a server limit (e.g. artifact part size). Not retryable as-is.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: >-
        The request is well-formed but fails integrity validation against the
        initiate declaration or the assembled bytes (part count, byte length,
        or SHA-256 mismatch).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Unexpected server failure. Retryable with backoff.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    # ------------------------------------------------------------- envelopes

    Error:
      type: object
      description: >-
        Standard error envelope returned by all 4xx/5xx responses (the shared
        ApiError DTO).
      required: [code, message, retryable]
      properties:
        code:
          type: string
          description: Stable machine-readable error code, e.g. invalid_pairing_code, artifact_hash_mismatch.
        message:
          type: string
          description: Human-readable explanation; safe to log, never contains secrets.
        retryable:
          type: boolean
          description: Whether retrying the identical request can succeed (design doc section 16.2).
        correlationId:
          type: string
          nullable: true
          description: Server-generated identifier for tracing this failure across logs.

    # -------------------------------------------------------------- captures

    Capture:
      type: object
      description: >-
        Server capture state (the CaptureResponse DTO): device-neutral unit of
        user input (design doc section 6.1) plus its artifact summaries.
      required:
        - captureId
        - sourceDeviceId
        - sourcePlatform
        - captureType
        - capturedAtUtc
        - status
        - serverRevision
        - createdAtUtc
        - artifacts
      properties:
        captureId:
          type: string
          format: uuid
        sourceDeviceId:
          type: string
          format: uuid
        sourcePlatform:
          type: string
          enum: [ios, windows, other]
        captureType:
          type: string
          enum: [memory, idea, trip_log, reminder, question, unclassified]
        capturedAtUtc:
          type: string
          format: date-time
        timezoneId:
          type: string
          nullable: true
          description: IANA timezone identifier, e.g. America/Toronto.
        localOffsetMinutes:
          type: integer
          nullable: true
          description: UTC offset in minutes at capture time.
        tripId:
          type: string
          format: uuid
          nullable: true
        titleHint:
          type: string
          nullable: true
        userNote:
          type: string
          nullable: true
        status:
          type: string
          enum: [local_only, uploading, received, processing, review_ready, completed, failed]
        serverRevision:
          type: integer
          format: int64
        createdAtUtc:
          type: string
          format: date-time
        artifacts:
          type: array
          items:
            $ref: '#/components/schemas/ArtifactSummary'

    CaptureCreateRequest:
      type: object
      description: >-
        Capture creation payload. Mirrors the design doc section 11.3 example;
        the client generates the captureId.
      required: [captureId, capturedAtUtc]
      properties:
        captureId:
          type: string
          format: uuid
        sourceDeviceId:
          type: string
          format: uuid
        captureType:
          type: string
          enum: [memory, idea, trip_log, reminder, question, unclassified]
          default: unclassified
        capturedAtUtc:
          type: string
          format: date-time
        timezoneId:
          type: string
          nullable: true
        localOffsetMinutes:
          type: integer
          nullable: true
        tripId:
          type: string
          format: uuid
          nullable: true
        titleHint:
          type: string
          nullable: true
        userNote:
          type: string
          nullable: true
        locationContext:
          $ref: '#/components/schemas/LocationContext'
        clientSchemaVersion:
          type: integer
          minimum: 1
          default: 1
      example:
        captureId: "8d3afab4-bd0c-43db-9b43-18cc4ddc49aa"
        sourceDeviceId: "5ef474dd-02f8-48e5-9616-a48b27017466"
        captureType: "trip_log"
        capturedAtUtc: "2026-08-06T19:46:00Z"
        timezoneId: "America/Toronto"
        localOffsetMinutes: -240
        tripId: "fb811275-7cf4-490f-a908-16657d1f92cb"
        locationContext:
          latitude: 43.6532
          longitude: -79.3832
          horizontalAccuracyM: 18.0
          headingDegrees: 255.0
          speedMps: 21.4
        clientSchemaVersion: 1

    CaptureUpdateRequest:
      type: object
      description: >-
        Patchable, non-critical descriptive fields; last writer wins
        (design doc section 12.2). Omitted fields are left unchanged.
      properties:
        captureType:
          type: string
          enum: [memory, idea, trip_log, reminder, question, unclassified]
        titleHint:
          type: string
          nullable: true
        userNote:
          type: string
          nullable: true
        tripId:
          type: string
          format: uuid
          nullable: true

    LocationContext:
      type: object
      description: Single location snapshot attached to a capture (design doc section 11.3).
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
        longitude:
          type: number
          format: double
        horizontalAccuracyM:
          type: number
          format: double
        headingDegrees:
          type: number
          format: double
        speedMps:
          type: number
          format: double

    # -------------------------------------------------------------- artifacts

    ArtifactSummary:
      type: object
      description: >-
        Wire summary of a capture artifact (design doc section 6.2), embedded
        in Capture.artifacts and CaptureChangePayload.audioArtifact. Before
        completion, byteLength and sha256 echo the declared expected values;
        once complete they are the measured values.
      required: [artifactId, artifactType, state]
      properties:
        artifactId:
          type: string
          format: uuid
        artifactType:
          type: string
          enum: [audio_original, audio_normalized, transcript, waveform, image, metadata]
        mediaType:
          type: string
          nullable: true
          description: MIME type, e.g. audio/mp4.
        originalFileName:
          type: string
          nullable: true
        byteLength:
          type: integer
          format: int64
          nullable: true
        sha256:
          type: string
          nullable: true
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the artifact bytes.
        state:
          type: string
          enum: [pending, uploading, complete, failed, purged]
          description: >-
            SERVER artifact lifecycle state (upload progress on the sync
            service). Distinct from the Windows-local upload_state vocabulary
            (pending_upload, uploaded, ...), which never crosses this API.
            purged (added in v1.4) means the retention sweep removed the bytes
            after Windows acknowledged archival; byteLength and sha256 keep the
            measured values, and a download answers 410 artifact_purged. A
            client that only downloads complete artifacts needs no change to
            handle it.

    ArtifactInitiateRequest:
      type: object
      description: Declares an artifact and its integrity data before any bytes move.
      required: [expectedByteLength, expectedSha256]
      properties:
        artifactId:
          type: string
          format: uuid
          nullable: true
          description: Client-generated artifact ID; the server mints one when absent.
        artifactType:
          type: string
          enum: [audio_original, audio_normalized, transcript, waveform, image, metadata]
          default: audio_original
        mediaType:
          type: string
          nullable: true
        originalFileName:
          type: string
          nullable: true
        expectedByteLength:
          type: integer
          format: int64
          minimum: 1
        expectedSha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Lowercase hex SHA-256 of the complete artifact bytes.

    ArtifactInitiateResponse:
      type: object
      required: [artifactId, partSizeBytes, expectedPartCount]
      properties:
        artifactId:
          type: string
          format: uuid
        partSizeBytes:
          type: integer
          format: int64
          description: Maximum accepted bytes per uploaded part.
        expectedPartCount:
          type: integer
          format: int32
          minimum: 1
          description: Number of parts the client must upload for expectedByteLength.

    ArtifactCompleteRequest:
      type: object
      description: >-
        Completion claim; the server validates it against the initiate
        declaration and the assembled bytes (design doc section 11.4).
      required: [partCount, totalByteLength, sha256]
      properties:
        partCount:
          type: integer
          format: int32
          minimum: 1
        totalByteLength:
          type: integer
          format: int64
          minimum: 1
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase hex SHA-256; must match the initiate declaration and the
            assembled bytes.

    ArtifactCompleteResponse:
      type: object
      required: [artifactId, state, byteLength, sha256]
      properties:
        artifactId:
          type: string
          format: uuid
        state:
          type: string
          enum: [pending, uploading, complete, failed]
          description: >-
            Server artifact lifecycle state (see ArtifactSummary.state);
            complete on success.
        byteLength:
          type: integer
          format: int64
          description: Measured length of the assembled artifact.
        sha256:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Measured lowercase hex SHA-256 of the assembled artifact.

    # ------------------------------------------------------------------ sync

    SyncChange:
      type: object
      description: >-
        One entry in the server's ordered change log, as returned by pull
        (design doc sections 6.7 and 12.1). Pulls exclude changes that
        originated on the calling device.
      required: [changeId, entityType, entityId, operation, revision, changedAtUtc]
      properties:
        changeId:
          type: integer
          format: int64
          description: Monotonically increasing server change ID — the pull cursor.
        entityType:
          type: string
          enum: [capture, capture_artifact, capture_status, recording_queue,
                 pending_event, event, era, person, pending_event_decision,
                 assistant_turn, assistant_turn_chunk]
          description: >-
            Entity discriminator (the SyncChangeEntityType constants). event,
            era, person and pending_event are the read-only timeline projection
            Windows publishes (v1.4); pending_event_decision is a companion's
            verdict travelling the other way.
        entityId:
          type: string
          description: >-
            The entity's ID. For capture_status this is the captureId, so a
            capture has exactly one status entity. For the timeline
            projections it is the projected row's own key (eventId, eraId,
            personId, pendingEventId) in canonical lowercase UUID form, and for
            pending_event_decision the pendingEventId being decided.
        operation:
          type: string
          enum: [upsert, delete]
        revision:
          type: integer
          format: int64
        changedAtUtc:
          type: string
          format: date-time
        sourceDeviceId:
          type: string
          nullable: true
          description: >-
            Device the change originated on; null for server-originated
            changes.
        payloadJson:
          type: string
          nullable: true
          description: >-
            Entity-type-specific payload, delivered as a JSON string — not an
            embedded object. For capture upserts it encodes a
            CaptureChangePayload; for capture_status upserts, a
            CaptureStatusChangePayload; for event, era, person and
            pending_event upserts an EventProjectionPayload,
            EraProjectionPayload, PersonProjectionPayload or
            PendingEventProjectionPayload; for pending_event_decision a
            PendingEventDecisionPayload; for assistant_turn and
            assistant_turn_chunk an AssistantTurnChangePayload or
            AssistantTurnChunkPayload. Null for tombstones and payload-free
            changes.

    CaptureChangePayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for capture changes:
        everything the Windows client needs to build a RemoteCaptureEnvelope
        and download the audio. Documented here for reference — on the wire it
        travels as a string inside payloadJson, not as an inline object.
      required:
        - captureId
        - sourceDeviceId
        - sourcePlatform
        - captureType
        - capturedAtUtc
        - clientSchemaVersion
        - status
      properties:
        captureId:
          type: string
          format: uuid
        sourceDeviceId:
          type: string
          format: uuid
        sourcePlatform:
          type: string
          enum: [ios, windows, other]
        captureType:
          type: string
          enum: [memory, idea, trip_log, reminder, question, unclassified]
        capturedAtUtc:
          type: string
          format: date-time
        timezoneId:
          type: string
          nullable: true
        localOffsetMinutes:
          type: integer
          nullable: true
        tripId:
          type: string
          format: uuid
          nullable: true
        titleHint:
          type: string
          nullable: true
        userNote:
          type: string
          nullable: true
        clientSchemaVersion:
          type: integer
          default: 1
        status:
          type: string
          enum: [local_only, uploading, received, processing, review_ready, completed, failed]
          description: Capture status at the time of the change.
        audioArtifact:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ArtifactSummary'
          description: >-
            The audio artifact to download; set only once a completed audio
            artifact exists (its arrival triggers Windows ingestion).

    CaptureStatusChangePayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for capture_status
        changes: the Windows-side processing status of one capture, so the
        capture's phone can follow the whole lifecycle without opening Windows
        (design doc section 19 Phase 3). Documented here for reference — on the
        wire it travels as a string inside payloadJson, not as an inline
        object.


        Direction is one-way, Windows → service → the capture's phone: Windows
        writes the status into its own sync outbox, pushes it, and the phone
        receives it on its next pull. Nothing here is an instruction; it is a
        read-only projection of Windows-side state. Editing transcripts and
        approving events stay on Windows, and the phone never authors this
        entity type.


        The service keeps one row per capture, overwritten in place (latest
        wins) — the change log, not the projection, holds the history — and the
        payload a device pulls is re-serialized from that stored row, so a
        pulled payload can never disagree with what the service persisted.


        Payloads use the same camelCase web defaults as the rest of the API and
        do not strip nulls, so a nullable field that has no value is present as
        null rather than absent.
      required: [captureId, status, updatedAtUtc, transcriptAvailable]
      properties:
        captureId:
          type: string
          format: uuid
          description: >-
            The capture this status belongs to. Must equal the change's
            entityId; a mismatch rejects the push entry.
        status:
          type: string
          enum: [local_only, uploading, received, processing, review_ready, completed, failed]
          description: >-
            Coarse lifecycle state, the same vocabulary as Capture.status. A
            value outside this list rejects the push entry.
        processingStage:
          type: string
          nullable: true
          description: >-
            Finer-grained position inside status, mirroring the Windows queue's
            stage vocabulary: pending_download, verifying,
            ready_for_transcription, transcribing, extracting, review_ready,
            completed, failed_retryable, failed_configuration, failed_permanent.
            Null when the publisher has no detail finer than the status.
            Deliberately not an enum here, unlike status: the service stores and
            forwards the stage without validating it, so clients must keep it as
            a string and tolerate a value they do not recognize.
        updatedAtUtc:
          type: string
          format: date-time
          description: >-
            When Windows produced the status. Display only — consumers apply
            changes in changeId order, never by this clock.
        transcriptAvailable:
          type: boolean
          description: True once a transcript exists for the capture on Windows.
        transcriptPreview:
          type: string
          nullable: true
          maxLength: 600
          description: >-
            Leading excerpt of the transcript, truncated by the publisher. The
            full transcript deliberately stays on Windows in this phase — this
            is a preview, not a replica. The service refuses an over-long
            preview rather than truncating it, so truncation stays the
            publisher's decision.
        transcriptCharCount:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Character count of the complete Windows-side transcript, so the
            phone can show how much the preview omits without holding the text.
        pendingEventCount:
          type: integer
          nullable: true
          minimum: 0
          description: >-
            Events extracted from this capture that are awaiting review on
            Windows. Null before extraction has run — the contract prefers null
            over an invented zero.
        approvedEventCount:
          type: integer
          nullable: true
          minimum: 0
          description: Events from this capture already approved onto the timeline.
        failureReason:
          type: string
          nullable: true
          description: >-
            User-facing reason when status is failed; null otherwise. By
            contract it never carries transcript content, file paths, or
            credentials (design doc section 14.5), so publishers send fixed
            text keyed on the failure stage rather than raw error output.
        failureRetryable:
          type: boolean
          nullable: true
          description: >-
            True when the failure is expected to clear on retry (design doc
            section 16.2). Null when the publisher cannot classify it — which
            is not evidence either way.

    # --------------------------------------------------- timeline projections

    EventProjectionPayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for event changes: a
        read-only projection of one archive event, published by the owner's
        Windows device so a companion can draw a timeline it does not own
        (design doc section 19 Phase 3; the EventProjectionPayload DTO).
        Documented here for reference — on the wire it travels as a string
        inside payloadJson, not as an inline object.


        Denormalised on purpose: tags, people and location names ride inline
        so a consumer draws a bubble rather than reconstructs a graph. Every
        date-time is UTC; startDate and friends are the archive's dates in a
        UTC encoding, which is why clients render displayDate rather than
        localising them. Payloads do not strip nulls.
      required:
        - eventId
        - title
        - startDate
        - datePrecision
        - tags
        - personIds
        - locations
        - mediaCount
        - updatedAtUtc
      properties:
        eventId:
          type: string
          format: uuid
          description: Equals the change's entityId.
        title:
          type: string
        description:
          type: string
          nullable: true
          description: Trimmed to a readable length by the publisher; not the archive's full text.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        datePrecision:
          type: string
          enum: [exact, day, month, season, year, decade, unknown]
          description: >-
            How much of startDate to believe. Carried rather than derived so a
            companion never invents an exact day for a memory the user dated to
            a summer; a value outside this list rejects the push entry.
        displayDate:
          type: string
          nullable: true
          description: Precision-honest display string ("Summer 2003"), formatted by Windows.
        earliestPossible:
          type: string
          format: date-time
          nullable: true
        latestPossible:
          type: string
          format: date-time
          nullable: true
        category:
          type: string
          nullable: true
        eraId:
          type: string
          format: uuid
          nullable: true
        tags:
          type: array
          items:
            type: string
          description: Tag names, already resolved.
        personIds:
          type: array
          items:
            type: string
            format: uuid
          description: Linked person ids; names come from the person projection.
        locations:
          type: array
          items:
            type: string
          description: Location display names, already resolved.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        mediaCount:
          type: integer
          minimum: 0
          description: Attached media items, so a companion can show a badge without fetching any.
        updatedAtUtc:
          type: string
          format: date-time

    EraProjectionPayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for era changes: a
        life period, projected for timeline backgrounds and the eras list
        (the EraProjectionPayload DTO). Travels as a string inside
        payloadJson.
      required: [eraId, name, startDate, colorCode, displayOrder, updatedAtUtc]
      properties:
        eraId:
          type: string
          format: uuid
          description: Equals the change's entityId.
        name:
          type: string
        subtitle:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
          description: Null for an ongoing era.
        colorCode:
          type: string
          description: >-
            "#RRGGBB". Colours cross as strings and the client builds its own
            brush. The service also accepts "#AARRGGBB", which the Windows
            column can hold; anything that is not a hex colour rejects the
            push entry.
        categoryId:
          type: string
          nullable: true
        categoryName:
          type: string
          nullable: true
        displayOrder:
          type: integer
        updatedAtUtc:
          type: string
          format: date-time

    PersonProjectionPayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for person changes: a
        contact-book person, projected for the People hub and for resolving
        EventProjectionPayload.personIds (the PersonProjectionPayload DTO).
        Travels as a string inside payloadJson.
      required: [personId, name, isFavorite, eventCount, updatedAtUtc]
      properties:
        personId:
          type: string
          format: uuid
          description: Equals the change's entityId.
        name:
          type: string
        nickname:
          type: string
          nullable: true
        relationship:
          type: string
          nullable: true
        mergedIntoId:
          type: string
          format: uuid
          nullable: true
          description: >-
            When set, this person was merged into another and this id is a
            tombstone companions must follow rather than show as a duplicate;
            a value that is not a UUID rejects the push entry.
        isFavorite:
          type: boolean
        eventCount:
          type: integer
          minimum: 0
          description: Events this person appears in, so the hub can sort without a scan.
        updatedAtUtc:
          type: string
          format: date-time

    PendingEventProjectionPayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for pending_event
        changes: an extracted event awaiting review, projected so a companion
        can show the queue and act on it with a PendingEventDecisionPayload
        (the PendingEventProjectionPayload DTO). Travels as a string inside
        payloadJson.
      required:
        - pendingEventId
        - title
        - startDate
        - datePrecision
        - confidenceScore
        - tags
        - peopleNames
        - updatedAtUtc
      properties:
        pendingEventId:
          type: string
          format: uuid
          description: Equals the change's entityId.
        captureId:
          type: string
          format: uuid
          nullable: true
          description: Capture this was extracted from, so the companion can link back.
        title:
          type: string
        description:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
          nullable: true
        datePrecision:
          type: string
          enum: [exact, day, month, season, year, decade, unknown]
        displayDate:
          type: string
          nullable: true
        category:
          type: string
          nullable: true
        confidenceScore:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: Extraction confidence, so the reviewer can triage.
        tags:
          type: array
          items:
            type: string
        peopleNames:
          type: array
          items:
            type: string
          description: People the extraction found, by name — they may not exist yet.
        transcriptPreview:
          type: string
          nullable: true
          maxLength: 600
          description: >-
            Bounded excerpt of the source transcript (design doc section 14.5),
            never the whole thing; the same bound as
            CaptureStatusChangePayload.transcriptPreview, refused rather than
            trimmed when exceeded.
        updatedAtUtc:
          type: string
          format: date-time

    PendingEventDecisionPayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for
        pending_event_decision changes: a companion's approve/reject verdict
        on a pending event — the one write a non-Windows device may make (the
        PendingEventDecisionPayload DTO). Travels as a string inside
        payloadJson.


        Safe to accept precisely because it is not an edit: it carries no
        field values to merge, applying it twice means what applying it once
        meant, and two devices sending the same verdict agree by
        construction. Windows still performs the approval and drops verdicts
        for reviews it has already resolved. The service relays the entry
        verbatim; it keeps no pending events to validate against.
      required: [pendingEventId, decision, decidedByDeviceId, decidedAtUtc]
      properties:
        pendingEventId:
          type: string
          format: uuid
          description: Equals the change's entityId.
        decision:
          type: string
          enum: [approve, reject]
          description: >-
            Exact lowercase. Deliberately has no default: a missing or
            unknown verdict is rejected rather than read as approve, because
            the failure mode of a missing field must never be a write to the
            archive.
        decidedByDeviceId:
          type: string
          format: uuid
          description: >-
            Must be the device pushing the decision (change_not_permitted
            otherwise); Windows keeps it as the audit trail of who reviewed
            what.
        decidedAtUtc:
          type: string
          format: date-time
        corrections:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/PendingEventCorrections'
          description: >-
            Optional reviewer corrections applied before approval. Null means
            approve as extracted.

    PendingEventCorrections:
      type: object
      description: >-
        The narrow set of fields a reviewer may correct while approving (the
        PendingEventCorrections DTO) — title and dates, the fields realistically
        fixed on a phone. Deliberately not general editing: it rides the
        decision because fixing a title while approving is one act, not two.
      properties:
        title:
          type: string
          nullable: true
        startDate:
          type: string
          format: date-time
          nullable: true
        endDate:
          type: string
          format: date-time
          nullable: true
        datePrecision:
          type: string
          enum: [exact, day, month, season, year, decade, unknown]
          nullable: true
          description: A value outside the vocabulary rejects the push entry.
        category:
          type: string
          nullable: true

    SyncPushRequest:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          description: Client outbox entries in clientSequence order.
          items:
            $ref: '#/components/schemas/SyncPushEntry'

    SyncPushEntry:
      type: object
      description: >-
        One client-recorded change. clientSequence — the device-local outbox
        sequence — makes each entry idempotent per device.
      required: [clientSequence, entityType, entityId, operation]
      properties:
        clientSequence:
          type: integer
          format: int64
        entityType:
          type: string
          enum: [capture, capture_artifact, capture_status, recording_queue,
                 pending_event, event, era, person, pending_event_decision,
                 assistant_turn, assistant_turn_chunk]
          description: >-
            Entity discriminator. event, era, person and pending_event may be
            pushed only by the owner's Windows device — any other device is
            refused per entry with change_not_permitted — and
            pending_event_decision is the one entity a companion may author
            besides its own captures.
        entityId:
          type: string
          description: >-
            The entity's ID; for capture_status the captureId, which must equal
            the payload's captureId. For the timeline projections and
            decisions it must be a UUID in canonical lowercase "D" form equal
            to the payload's own ID, so every consumer keys the same row the
            same way.
        operation:
          type: string
          enum: [upsert, delete]
          description: >-
            capture_status, assistant_turn, assistant_turn_chunk and
            pending_event_decision accept upsert only — a status is a
            latest-wins projection with nothing to tombstone, and a verdict is
            a fact that cannot be retracted. delete tombstones one of the four
            timeline projections and needs no payload.
        payloadJson:
          type: string
          nullable: true
          description: >-
            Entity-type-specific payload as a JSON string. Required for
            capture_status, which carries no meaning without one; optional for
            entity types whose change is meaningful on its own.
        changedAtUtc:
          type: string
          format: date-time
          description: >-
            When the change happened on the device; the server substitutes
            receipt time when absent.

    SyncPushResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: One result per pushed entry, in request order.
          items:
            $ref: '#/components/schemas/SyncPushEntryResult'

    SyncPushEntryResult:
      type: object
      required: [clientSequence, accepted, duplicate]
      properties:
        clientSequence:
          type: integer
          format: int64
        accepted:
          type: boolean
        duplicate:
          type: boolean
          description: >-
            True when the entry was already applied by an earlier push
            (idempotent replay).
        serverChangeId:
          type: integer
          format: int64
          nullable: true
          description: Change-log ID assigned to the accepted entry; null when rejected.
        error:
          type: string
          nullable: true
          description: >-
            Machine-readable rejection reason — an error code, optionally
            followed by details (e.g. "validation_error: operation must be
            upsert or delete"). Branch on the code before the colon:
            validation_error and capture_not_found are not retryable as-is,
            internal_error is. Null when accepted.

    SyncPullResponse:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: '#/components/schemas/SyncChange'
        nextCursor:
          type: integer
          format: int64
          description: >-
            Cursor to store after applying every change in this page; pass it
            to the next pull and, once durably applied, to ack.
        hasMore:
          type: boolean
          description: True when more changes were available beyond the limit.

    SyncAckRequest:
      type: object
      required: [cursor]
      properties:
        cursor:
          type: integer
          format: int64
          description: Highest change ID the device has durably applied.

    # --------------------------------------------------------------- devices

    DeviceRegisterRequest:
      type: object
      description: >-
        Device registration, gated by the owner pairing code (design doc
        section 14.1).
      required: [pairingCode, platform, displayName]
      properties:
        pairingCode:
          type: string
          description: Owner pairing code proving the caller may join this sync domain.
        platform:
          type: string
          enum: [ios, windows, other]
        displayName:
          type: string
        appVersion:
          type: string
          nullable: true
        publicKey:
          type: string
          nullable: true
          description: >-
            Optional base64-encoded device public key for future artifact
            envelope encryption.

    DeviceRegisterResponse:
      type: object
      required: [deviceId, ownerId, accessToken, accessTokenExpiresAtUtc, refreshToken]
      properties:
        deviceId:
          type: string
          format: uuid
        ownerId:
          type: string
          format: uuid
        accessToken:
          type: string
          description: Short-lived bearer token for subsequent calls.
        accessTokenExpiresAtUtc:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: Long-lived token; store in Keychain (iOS) / protected storage (Windows).

    TokenRefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenRefreshResponse:
      type: object
      required: [accessToken, accessTokenExpiresAtUtc, refreshToken]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAtUtc:
          type: string
          format: date-time
        refreshToken:
          type: string
          description: >-
            Rotated refresh token. The previous token stays valid only within
            the server's recovery grace window (default 300s), which exists so
            a lost response or concurrent refresh cannot strand the device.

    DeviceInfo:
      type: object
      required: [deviceId, platform, displayName]
      properties:
        deviceId:
          type: string
          format: uuid
        platform:
          type: string
          enum: [ios, windows, other]
        displayName:
          type: string
        lastSeenAtUtc:
          type: string
          format: date-time
          nullable: true
        revokedAtUtc:
          type: string
          format: date-time
          nullable: true
          description: Set when the device has been revoked; its tokens no longer work.

    # ----------------------------------------------------------------- trips

    Trip:
      type: object
      description: >-
        Trip lifecycle entity (design doc section 6.4; the TripResponse DTO).
        Owner-scoped: every device of the owner sees the same trips.
      required: [tripId, name, status, createdAtUtc, updatedAtUtc]
      properties:
        tripId:
          type: string
          format: uuid
        name:
          type: string
        startedAtUtc:
          type: string
          format: date-time
          nullable: true
        endedAtUtc:
          type: string
          format: date-time
          nullable: true
        originLabel:
          type: string
          nullable: true
        destinationLabel:
          type: string
          nullable: true
        status:
          type: string
          enum: [planned, active, paused, completed, archived]
        preferencesJson:
          type: object
          additionalProperties: true
          nullable: true
          description: Free-form trip preferences (detour categories, budget, pace, ...). Stored and returned verbatim.
        createdAtUtc:
          type: string
          format: date-time
          description: When the service created the trip (added in v1.4).
        updatedAtUtc:
          type: string
          format: date-time
          description: When the trip last changed on the service (added in v1.4).

    TripCreateRequest:
      type: object
      description: Creates a trip (the TripCreateRequest DTO). The server mints the tripId.
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        startedAtUtc:
          type: string
          format: date-time
          nullable: true
        originLabel:
          type: string
          nullable: true
          maxLength: 500
        destinationLabel:
          type: string
          nullable: true
          maxLength: 500
        status:
          type: string
          enum: [planned, active, paused, completed, archived]
          default: planned
        preferencesJson:
          type: object
          additionalProperties: true
          nullable: true

    TripUpdateRequest:
      type: object
      description: >-
        Patchable trip fields. Status changes follow the trip state machine;
        the latest valid transition wins (design doc section 12.2).
      properties:
        name:
          type: string
        startedAtUtc:
          type: string
          format: date-time
          nullable: true
        endedAtUtc:
          type: string
          format: date-time
          nullable: true
        originLabel:
          type: string
          nullable: true
        destinationLabel:
          type: string
          nullable: true
        status:
          type: string
          enum: [planned, active, paused, completed, archived]
        preferencesJson:
          type: object
          additionalProperties: true
          nullable: true

    RouteContext:
      type: object
      description: >-
        Point-in-time route/location snapshot for a trip (design doc section
        6.4; the TripRouteContext DTO — named differently in C# only because
        ASP.NET Core has a RouteContext type). The same shape is the request
        and the response: routeContextId and tripId are optional on the way in
        and always present on the way out. Optional fields the client did not
        send come back as null, since responses do not strip nulls.
      required: [capturedAtUtc, latitude, longitude]
      properties:
        routeContextId:
          type: string
          format: uuid
          nullable: true
          description: Client-generated snapshot ID; the server mints one when absent or not a UUID.
        tripId:
          type: string
          format: uuid
          nullable: true
          description: Taken from the path on write; present on read.
        capturedAtUtc:
          type: string
          format: date-time
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
        horizontalAccuracyM:
          type: number
          format: double
          nullable: true
        headingDegrees:
          type: number
          format: double
          nullable: true
        speedMps:
          type: number
          format: double
          nullable: true
        routeProgress:
          type: number
          format: double
          nullable: true
          minimum: 0
          maximum: 1
          description: Fraction of the route completed, 0.0 to 1.0.
        remainingDistanceM:
          type: number
          format: double
          nullable: true
        remainingDurationS:
          type: number
          format: double
          nullable: true
        currentRoadName:
          type: string
          nullable: true
        destinationEtaUtc:
          type: string
          format: date-time
          nullable: true
        provider:
          type: string
          nullable: true
          description: Source of the routing data, e.g. apple_maps.

    # --------------------------------------------------------------- detours

    DetourSuggestion:
      type: object
      description: >-
        Verified detour suggestion (design doc section 6.5; the
        DetourSuggestion DTO). The descriptive fields are what the place
        provider produced and are relayed as they came — a field the provider
        could not fill is null, since responses do not strip nulls. Only state
        moves, through the accept/dismiss/save endpoints and expiry.
      required: [suggestionId, tripId, generatedAtUtc, name, state]
      properties:
        suggestionId:
          type: string
          format: uuid
        tripId:
          type: string
          format: uuid
        generatedAtUtc:
          type: string
          format: date-time
        expiresAtUtc:
          type: string
          format: date-time
          nullable: true
          description: >-
            When the suggestion stops being actionable; the service applies a
            default lifetime when the provider sets none. Past it, the state
            becomes expired on the next read.
        placeProvider:
          type: string
          nullable: true
        providerPlaceId:
          type: string
          nullable: true
          description: The provider's own place ID; what keeps a place from being suggested twice.
        name:
          type: string
        category:
          type: string
          nullable: true
        reason:
          type: string
          nullable: true
          description: Short human-readable justification for the suggestion.
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        routeAddedDistanceM:
          type: number
          format: double
          nullable: true
        routeAddedDurationS:
          type: number
          format: double
          nullable: true
        openStatus:
          type: string
          enum: [open, closed, closing_soon, unknown]
          nullable: true
        nextOpenInterval:
          type: string
          nullable: true
        priceSummary:
          type: string
          nullable: true
        admissionCurrency:
          type: string
          nullable: true
        confidence:
          type: number
          format: double
          nullable: true
          description: Verification confidence, 0.0 to 1.0.
        verificationSourcesJson:
          type: object
          additionalProperties: true
          nullable: true
          description: Provenance of the verification checks.
        state:
          type: string
          enum: [proposed, heard, saved, accepted, dismissed, expired]

    # ------------------------------------------------------------- assistant

    AssistantSessionCreateRequest:
      type: object
      description: >-
        Opens a conversation. Sessions scope turn ordering and shared context;
        only the device that opened one may add turns to it.
      properties:
        preferredResponder:
          type: string
          enum: [windows, provider, on_device]
          default: windows
          description: >-
            Default responder for turns in this session. windows is the default
            because the archive, the retrieval index, and the extraction prompts
            all live there, so it is the only responder that can ground an
            answer in the user's full history — at the cost of needing Windows
            online, since a turn otherwise simply waits. provider has the service
            call a configured LLM directly, which answers while Windows sleeps
            but is grounded only in what the client supplied. on_device means the
            phone pre-processed and brings its own context, which is cheapest and
            works nearly offline but knows only what the device holds. Each turn
            may override this, so the session's choice is a default, not a
            binding.
        surface:
          type: string
          nullable: true
          description: >-
            Free-text label for the surface that opened the session ("carplay",
            "watch", "mac"), for diagnostics only. Never used for routing — a
            surface cannot earn different behavior by naming itself.
        mode:
          type: string
          enum: [memory_query, trip_assistant, capture_followup]
          default: memory_query
          description: >-
            What this conversation is for (design doc section 6.6). Advisory
            routing context for the responder rather than access control: it
            tells Windows whether to weight the archive, the current trip, or
            the capture the user just made, so the same question can mean
            different things on different surfaces.
        tripId:
          type: string
          format: uuid
          nullable: true
          description: >-
            Trip this session belongs to, when mode is trip_assistant. Trips
            arrive in Phase 5; the field exists now so a Phase 4 client does not
            have to be revised to carry one.

    AssistantSessionResponse:
      type: object
      description: A conversation.
      required:
        - sessionId
        - deviceId
        - preferredResponder
        - createdAtUtc
        - lastTurnAtUtc
        - turnCount
      properties:
        sessionId:
          type: string
          format: uuid
        deviceId:
          type: string
          format: uuid
          description: Device that opened the session; only that device may add turns.
        preferredResponder:
          type: string
          enum: [windows, provider, on_device]
          description: >-
            The session's default responder; every turn may override it.
        createdAtUtc:
          type: string
          format: date-time
        lastTurnAtUtc:
          type: string
          format: date-time
          description: Last activity, so idle sessions can be reaped.
        turnCount:
          type: integer
          minimum: 0
        mode:
          type: string
          enum: [memory_query, trip_assistant, capture_followup]
          description: What this conversation is for (design doc section 6.6).
        tripId:
          type: string
          format: uuid
          nullable: true
          description: Trip this session belongs to, when it has one.

    AssistantTurnCreateRequest:
      type: object
      description: >-
        Asks a question. The turn is accepted and routed, never answered inline.
      required: [turnId, question]
      properties:
        turnId:
          type: string
          format: uuid
          description: >-
            Client-generated turn ID (lowercased UUID). This is what makes
            submission idempotent: a retry after a lost response returns the
            existing turn rather than asking the same question twice.
        question:
          type: string
          description: >-
            The question as text. Speech-to-text happens on the device, so the
            service never receives audio for a turn — which keeps this endpoint
            cheap and keeps voice data on the phone (design doc section 14.5).
        responder:
          type: string
          enum: [windows, provider, on_device]
          nullable: true
          description: >-
            Overrides the session's preferredResponder for this turn only; null
            uses the session's. Chosen per turn so a client can fall back the
            moment Windows goes offline without abandoning the conversation.
        clientContext:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AssistantContextItem'
          description: >-
            Context the device retrieved itself (on_device pre-processing).
            Bounded by the service in item count, per-item length, and total
            length; an oversized list is refused whole with 400
            validation_error rather than truncated, so a client is never
            silently answered on a fraction of what it sent.
        stream:
          type: boolean
          default: false
          description: >-
            Whether the client wants incremental chunks, delivered as
            assistant_turn_chunk changes on the sync feed. Advisory: a responder
            may ignore it and deliver one final answer, so clients must handle
            both.
        userAudioArtifactId:
          type: string
          format: uuid
          nullable: true
          description: >-
            A completed audio artifact holding the spoken question, for clients
            that do NOT transcribe locally (design doc section 6.6). On-device
            speech-to-text is an option, not the only path — a watch or a car
            surface may have no usable local recogniser — so the audio route
            stays expressible. The artifact is uploaded through the existing
            artifact endpoints and referenced here, so audio never travels
            inline through this API. Null on the on-device path, where question
            already carries the transcript.

    AssistantContextItem:
      type: object
      description: >-
        One piece of device-supplied grounding: an event the phone believes is
        relevant, with a bounded excerpt. Deliberately shaped like a Windows
        retrieval hit so a responder can treat device-supplied and archive
        context alike.
      required: [eventId, title]
      properties:
        eventId:
          type: string
          format: uuid
          description: >-
            The archive's identifier for the event, as Windows minted it. The
            service validates this one as a UUID because it is client input
            that will be handed to a responder; a citation's eventId, which the
            service only forwards, is not constrained.
        title:
          type: string
        eventDateUtc:
          type: string
          format: date-time
          nullable: true
          description: Event date as the device knows it; may be imprecise.
        excerpt:
          type: string
          nullable: true
          description: >-
            Bounded excerpt — never the full event text (design doc section
            14.5). This payload crosses devices, so it carries what a responder
            needs to read, not the archive itself.
        score:
          type: number
          format: double
          nullable: true
          description: Device-side similarity score, if it computed one. Advisory.

    AssistantTurnResponse:
      type: object
      description: >-
        State of a turn, as any participant sees it. A turn is pending from the
        moment it is accepted and stays there while it sits on the feed; only a
        responder that has actually claimed it moves it onward. completed,
        failed and cancelled are terminal and absolute — a late answer for a
        cancelled turn is discarded, never resurrected.
      required:
        - turnId
        - sessionId
        - sequence
        - question
        - status
        - requestedResponder
        - createdAtUtc
      properties:
        turnId:
          type: string
          format: uuid
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Monotonic within the session, assigned by the service.
        question:
          type: string
        status:
          type: string
          enum: [pending, dispatched, answering, completed, failed, cancelled]
          description: >-
            pending — accepted, durable and published to the feed, but not
            yet picked up. Publishing is not delivery: Windows may be asleep for
            hours, so the service deliberately does not advance the turn on
            publish rather than reporting a dispatch nothing has read.
            dispatched — a responder has claimed it; only a responder sets this.
            answering — a responder is producing an answer. completed — result
            is present. failed — ended without an answer; see the failure
            fields. cancelled — interrupted by the user.
        requestedResponder:
          type: string
          enum: [windows, provider, on_device]
          description: Responder the client asked for.
        actualResponder:
          type: string
          enum: [windows, provider, on_device]
          nullable: true
          description: >-
            Responder that actually answered. Both are recorded because they
            differ whenever a fallback happened, and a client that shows an
            answer should be able to say where it came from. Null until
            something claims the turn.
        createdAtUtc:
          type: string
          format: date-time
        completedAtUtc:
          type: string
          format: date-time
          nullable: true
          description: Set when the turn reached a terminal state; null before that.
        result:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AssistantTurnResult'
          description: Present once status is completed; null otherwise.
        failureReason:
          type: string
          nullable: true
          description: >-
            Display-safe failure text; by contract never a file path, a
            credential, or archive content (design doc section 14.5).
        failureRetryable:
          type: boolean
          nullable: true
          description: >-
            Whether retrying could plausibly succeed (design doc section 16.2).
            Null when the responder cannot classify the failure — which is not
            evidence either way.

    AssistantTurnResult:
      type: object
      description: An answer.
      required: [answer, grounding, citations]
      properties:
        answer:
          type: string
          description: The answer text. Clients speak it via on-device TTS.
        grounding:
          type: string
          enum: [archive, client_context, none]
          description: >-
            How well the answer is anchored to the user's actual archive.
            archive — retrieved from the full archive, and the citations refer to
            real events. client_context — grounded only in the context the client
            supplied with the turn. none — no retrieval at all, general
            knowledge. Clients must surface anything other than archive rather
            than presenting a general-knowledge answer as if it came from the
            user's own history.
        citations:
          type: array
          items:
            $ref: '#/components/schemas/AssistantCitation'
          description: >-
            Events the answer rests on. Empty is legitimate and meaningful: the
            Windows Ask feature refuses honestly when the archive holds nothing
            relevant, and that refusal arrives as a completed turn with no
            citations.
        model:
          type: string
          nullable: true
          description: Model that produced the answer, for display and diagnostics.
        elapsedMs:
          type: integer
          nullable: true
          minimum: 0
          description: Wall-clock milliseconds the responder took.
        assistantAudioArtifactId:
          type: string
          format: uuid
          nullable: true
          description: >-
            A completed audio artifact holding the spoken answer, when the
            responder synthesised one (design doc section 6.6). Null when the
            client is expected to speak answer with on-device text-to-speech,
            which is the cheaper default; a responder may provide both and let
            the client choose.

    AssistantCitation:
      type: object
      description: An event an answer cites.
      required: [eventId, title]
      properties:
        eventId:
          type: string
          description: >-
            The cited event's identifier. Deliberately unconstrained, unlike
            AssistantContextItem.eventId: the service forwards what a responder
            cited without validating it, and an imported event can carry an ID
            Windows did not mint, so clients keep it as an opaque string.
        title:
          type: string
        displayDate:
          type: string
          nullable: true
          description: >-
            Precision-honest display date ("Summer 2003"), already formatted by
            the responder. The wire carries the formatted string rather than a
            date plus a precision enum so that every client renders exactly what
            Windows would, instead of each reinventing the rounding.
        excerpt:
          type: string
          nullable: true
          description: >-
            Bounded excerpt supporting the claim — never the full event (design
            doc section 14.5).

    AssistantTurnChangePayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for assistant_turn
        changes. Documented here for reference — on the wire it travels as a
        string inside payloadJson, not as an inline object.


        Delivery reuses the existing change feed deliberately rather than adding
        a second transport: Windows already runs a pull/ack loop and an outbox,
        so an assistant turn is just another entity type riding proven plumbing
        that already survives suspension, network changes, and replay.


        Unlike every other entity type, this one flows in BOTH directions over
        that feed: the service publishes a pending turn toward Windows, and
        Windows publishes the answered turn back. Both directions carry the same
        shape, so a consumer applies the newest revision without caring which way
        it came. entityId is the turnId, and only upsert is used — a turn has
        nothing to tombstone, since cancellation is a status rather than a
        delete.


        Payloads use the same camelCase web defaults as the rest of the API and
        do not strip nulls, so a nullable field with no value is present as null
        rather than absent.
      required:
        - turnId
        - sessionId
        - sequence
        - question
        - status
        - requestedResponder
        - originDeviceId
        - updatedAtUtc
      properties:
        turnId:
          type: string
          format: uuid
          description: >-
            The turn this revision describes. Equals the change's entityId.
        sessionId:
          type: string
          format: uuid
        sequence:
          type: integer
          description: Monotonic within the session, assigned by the service.
        question:
          type: string
          description: >-
            The question as text; never audio, and never a transcript of the
            surrounding conversation (design doc section 14.5).
        status:
          type: string
          enum: [pending, dispatched, answering, completed, failed, cancelled]
          description: Turn lifecycle state, the same vocabulary as AssistantTurnResponse.status.
        requestedResponder:
          type: string
          enum: [windows, provider, on_device]
        actualResponder:
          type: string
          enum: [windows, provider, on_device]
          nullable: true
          description: Null until a responder claims the turn.
        originDeviceId:
          type: string
          format: uuid
          description: >-
            Device that asked, so Windows can scope retrieval and address the
            reply. Distinct from the change's sourceDeviceId, which names
            whichever device published this particular revision.
        clientContext:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/AssistantContextItem'
          description: Device-supplied grounding, when the turn carried any; null otherwise.
        result:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AssistantTurnResult'
          description: Present once the turn is answered; null before that.
        failureReason:
          type: string
          nullable: true
          description: >-
            Display-safe failure text; never a file path, a credential, or
            archive content (design doc section 14.5).
        failureRetryable:
          type: boolean
          nullable: true
          description: >-
            Whether retrying could plausibly succeed (design doc section 16.2);
            null when the publisher cannot classify the failure.
        updatedAtUtc:
          type: string
          format: date-time
          description: >-
            When the publisher produced this revision. Display and
            last-write-wins tie-breaking only — consumers apply changes in
            changeId order, never by this clock, exactly as with
            CaptureStatusChangePayload.updatedAtUtc.

    AssistantTurnChunkPayload:
      type: object
      description: >-
        Shape of the JSON string carried in payloadJson for
        assistant_turn_chunk changes: one incremental piece of a streaming
        answer. Documented here for reference — on the wire it travels as a
        string inside payloadJson, not as an inline object.


        Streaming is expressed as ordered chunks over the same feed rather than
        as a long-lived connection, because the phone's transport is already a
        pull loop that survives suspension and network changes. Chunks are
        advisory: a responder that cannot stream never publishes any, and the
        client renders the completed assistant_turn instead — so a client must
        treat chunks as an optional accelerant, never as the source of truth for
        an answer.
      required: [turnId, chunkIndex, delta, isFinal]
      properties:
        turnId:
          type: string
          format: uuid
          description: The turn being answered.
        chunkIndex:
          type: integer
          minimum: 0
          description: >-
            Zero-based and contiguous per turn, so a client can detect a gap
            rather than render a sentence with a hole in it.
        delta:
          type: string
          description: Text to append. Never a rewrite of what came before.
        isFinal:
          type: boolean
          description: >-
            True on the last chunk. The completed turn follows on the feed with
            the citations and grounding, which chunks deliberately do not carry.
